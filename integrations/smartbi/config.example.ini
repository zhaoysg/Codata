[smartbi]
base_url = https://smartbi.example.com/smartbi
username =
password =
# 按部署的实际认证协议配置；不支持浏览器或门户 SSO 重放。
login_method = clickLogin
# 单次请求超时秒数；报表刷新不自动重试。
timeout = 600
; 单次 HTTP 响应最大字节数，超过时明确报错，不解析局部响应。
max_response_bytes = 16777216

[fixed_parameters]
# 只填写该报表参数定义中真实存在的固定参数；调用方不能覆盖这些值。
# 固定参数不是终端用户权限隔离；不要填入未经确认的身份参数。
